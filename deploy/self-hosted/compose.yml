name: med-tracker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-med_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-med_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/self-hosted/.env}
    volumes:
      - med_tracker_postgres_data:/var/lib/postgresql/data
      - ../../api/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      med-internal:
        aliases:
          - postgres

  api:
    build:
      context: ../../api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-med_tracker}
      PGUSER: ${POSTGRES_USER:-med_tracker}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/self-hosted/.env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-med_tracker_session}
      SESSION_DAYS: ${SESSION_DAYS:-14}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      med-internal:
        aliases:
          - api

  web:
    build:
      context: ../../web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - med-public
      - med-internal

networks:
  med-public:
  med-internal:
    internal: true

volumes:
  med_tracker_postgres_data:
